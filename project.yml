name: LiveSpace
options:
  bundleIdPrefix: com.syntexco
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: CL53882GFX
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  LiveSpace:
    type: application
    platform: macOS
    sources:
      - path: LiveSpace
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntexco.livespace
        PRODUCT_NAME: LiveSpace
        INFOPLIST_FILE: LiveSpace/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - target: LiveSpaceSaver
        embed: false
    postCompileScripts:
      - name: "Embed Screen Saver Bundle"
        script: |
          set -e
          SAVER_BUILT="${BUILT_PRODUCTS_DIR}/LiveSpace.saver"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/LiveSpace.saver"
          mkdir -p "$(dirname "$DEST")"
          rm -rf "$DEST"
          cp -R "$SAVER_BUILT" "$DEST"
        basedOnDependencyAnalysis: false

  LiveSpaceSaver:
    type: bundle
    platform: macOS
    productType: com.apple.product-type.bundle
    sources:
      - path: LiveSpaceSaver
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntexco.livespace.saver
        PRODUCT_NAME: LiveSpace
        PRODUCT_MODULE_NAME: LiveSpaceSaverModule
        WRAPPER_EXTENSION: saver
        INFOPLIST_FILE: LiveSpaceSaver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: YES
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@loader_path/../Frameworks"

schemes:
  LiveSpace:
    build:
      targets:
        LiveSpace: all
        LiveSpaceSaver: all
    run:
      config: Debug
