name: LiveSpace
options:
  bundleIdPrefix: com.syntexco
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "Apple Development"
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"

targets:
  LiveSpace:
    type: application
    platform: macOS
    sources:
      - path: LiveSpace
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.syntexco.livespace
        PRODUCT_NAME: LiveSpace
        INFOPLIST_FILE: LiveSpace/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

schemes:
  LiveSpace:
    build:
      targets:
        LiveSpace: all
    run:
      config: Debug
